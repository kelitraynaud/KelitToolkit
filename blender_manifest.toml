schema_version = "1.0.0"

id = "kelittoolkit"
version = "0.9.3"
name = "Kelit Toolkit"
tagline = "Prepare and send Blender scenes to Unreal Engine"
maintainer = "Kélit Raynaud <kelitraynaud@gmail.com>"
type = "add-on"

website = "https://github.com/kelitraynaud/KelitToolkit"
tags = ["Pipeline", "Import-Export", "Scene"]

blender_version_min = "5.0.0"

license = ["SPDX:GPL-3.0-or-later"]
copyright = [
  "2026 Kélit Raynaud",
  "2022 Epic Games, Inc. (dependencies/remote_execution.py, MIT, see dependencies/LICENSE-BlenderTools.txt)",
]

[permissions]
network = "Sends Python commands to the local Unreal Editor"
files = "Exports USD/FBX files, can fix Unreal project config files"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/*.zip",
  "/tests/",
]
